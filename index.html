<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ספר המתכונים</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FDF5F6">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--hf:"Frank Ruhl Libre",Georgia,serif;--bg:#FDF5F6;--cd:#fff;--tx:#2a1f22;--mu:#7a6a6e;--bd:#f0dde3;--pri:#993556;--onp:#fff;--s0:#FBEAF0;--t0:#72243E;--s1:#FAECE7;--t1:#712B13;--s2:#E1F5EE;--t2:#085041;--rd:#A32D2D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1517;--cd:#2a2023;--tx:#f3e9ec;--mu:#b4a3a8;--bd:#3d2f33;--pri:#ED93B1;--onp:#4B1528;--s0:#4B1528;--t0:#F4C0D1;--s1:#4A1B0C;--t1:#F5C4B3;--s2:#04342C;--t2:#9FE1CB;--rd:#F09595}}
:root[data-theme="dark"]{--bg:#1c1517;--cd:#2a2023;--tx:#f3e9ec;--mu:#b4a3a8;--bd:#3d2f33;--pri:#ED93B1;--onp:#4B1528;--s0:#4B1528;--t0:#F4C0D1;--s1:#4A1B0C;--t1:#F5C4B3;--s2:#04342C;--t2:#9FE1CB;--rd:#F09595}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#fff 0%,#fdf4f6 55%,#f9e8ee 100%) fixed;color:var(--tx);font:16px/1.5 "Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(260px 260px at 90% 8%,rgba(244,192,209,.35),transparent 70%),radial-gradient(300px 300px at 5% 70%,rgba(250,236,231,.8),transparent 70%)}
#app{position:relative}
#app{max-width:480px;margin:0 auto;padding:18px 16px 110px;transition:zoom .2s}
h1,h2{font-family:var(--hf)}h1{font-size:28px;margin:0 0 4px;font-weight:500}h2{font-size:24px;margin:0 0 6px;font-weight:500}
.mu{color:var(--mu);font-size:14px}
.pg{animation:in .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px}
.pb{display:block;width:100%;height:50px;border:0;border-radius:25px;background:var(--pri);color:var(--onp);font-weight:600;font-size:17px;margin-top:10px}
.gb{display:block;width:100%;height:46px;border:1px solid var(--bd);border-radius:23px;background:transparent;margin-top:8px}
.cd{border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(153,53,86,.05),0 8px 20px rgba(153,53,86,.06)}
.c0{background:var(--s0);color:var(--t0)}.c1{background:var(--s1);color:var(--t1)}.c2{background:var(--s2);color:var(--t2)}
.tile{display:flex;gap:14px;align-items:center;width:100%;border:0;text-align:right;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ic{width:48px;height:48px;border-radius:50%;background:var(--cd);display:flex;align-items:center;justify-content:center;flex:none}
.tile b{display:block;font-size:17px}.tile span{font-size:13px}
input[type=text],textarea{width:100%;border:1px solid var(--bd);border-radius:16px;background:var(--cd);padding:12px 14px;margin-bottom:10px}
textarea{min-height:110px;resize:vertical}
nav{position:fixed;inset:auto 0 0 0;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{width:48px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:all .25s}
nav button.on{color:var(--t0);font-weight:600}nav button.on span{background:var(--s0);transform:scale(1.08)}
.row{display:flex;align-items:center;gap:8px}.row b{flex:1;font-size:17px}
.ib{border:0;background:none;color:inherit;padding:4px}
.dt{margin-top:10px;font-size:15px;line-height:1.7}.dt img{width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-bottom:8px}
.sm{height:38px;border-radius:19px;border:0;padding:0 14px;background:var(--cd);color:inherit;font-size:14px;margin-inline-end:8px}
.dots{display:flex;gap:6px;justify-content:center;margin:20px 0}.dots i{height:8px;width:8px;border-radius:4px;background:var(--bd);transition:all .3s}.dots i.on{width:22px;background:var(--pri)}
.hero{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#fbeaf0 72%);border:1px solid #f0cdd8;box-shadow:0 0 0 9px rgba(251,234,240,.65),0 12px 32px rgba(153,53,86,.14);color:var(--t0);display:flex;align-items:center;justify-content:center;margin:26px auto 28px;animation:pl 2.4s ease-in-out infinite}
.brand{text-align:center;font-family:var(--hf);letter-spacing:.14em;color:var(--pri);font-size:15px;font-weight:500}
.hc{background:linear-gradient(160deg,#fff,#fbeaf0);border:1px solid #f2d3dc;text-align:center;padding:22px 18px}
.hi{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;background:#fff;border:1px solid #f2d3dc;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.qt{text-align:center;font-family:var(--hf);color:var(--mu);font-style:italic;margin:18px 0 4px}
.hero .i{width:60px;height:60px}
@keyframes pl{50%{transform:scale(1.08)}}
#t{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:456px;margin:auto;background:var(--tx);color:var(--bg);border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:10px;z-index:9}
#t button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline}
.chip{border:1px solid var(--bd);background:transparent;border-radius:20px;height:40px;padding:0 16px;margin-inline-end:8px}.chip.on{background:var(--s0);color:var(--t0);border-color:transparent}
.bar{height:10px;border-radius:5px;background:var(--s0);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .5s}
.seg{display:flex;background:var(--s0);border-radius:16px;padding:4px;margin:14px 0}.seg button{flex:1;height:42px;border:0;border-radius:12px;background:none;color:var(--t0);font-weight:600;transition:all .2s}.seg button.on{background:var(--cd);box-shadow:0 2px 8px rgba(153,53,86,.12)}
.sc{height:36px;padding:0 12px;margin-bottom:8px;font-size:14px}
.pl{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:4px 6px 4px 12px;margin:8px 0 0 6px;font-size:14px}.pl button{border:0;background:none;color:var(--mu);font-size:18px;line-height:1;padding:0 4px}
.tag{background:var(--pri);color:var(--onp);border-radius:10px;padding:1px 10px;font-size:12px}
@media (prefers-reduced-motion:reduce){.pg,.hero{animation:none}}
</style>
</head>
<body>
<div id="app"><div id="m" class="pg"></div></div>
<div id="t"></div>
<nav id="nv" style="display:none"></nav>
<script>
const P={pot:'<path d="M5 11h14v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM3 11h18M9 8V6M12 8V4M15 8V6"/>',home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',book:'<path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"/>',add:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',spark:'<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/>',bin:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',dn:'<path d="M6 9l6 6 6-6"/>',bk:'<path d="M5 12h14M13 6l6 6-6 6"/>',imp:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',bell:'<path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/>'};
const I=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>';
const $=s=>document.querySelector(s);
const FL='<svg viewBox="0 0 200 20" style="display:block;margin:6px auto;width:150px;color:var(--pri);opacity:.7" fill="none" stroke="currentColor" stroke-width="1"><path d="M10 10h70M120 10h70"/><path d="M100 3l6 7-6 7-6-7z"/><circle cx="86" cy="10" r="1.6"/><circle cx="114" cy="10" r="1.6"/></svg>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let R=[],S={tab:'home',open:null,cf:null,q:'',sg:null,un:null},AI=null,zm=1;
try{R=JSON.parse(localStorage.getItem('rb1')||'[]');zm=+localStorage.getItem('rbz')||1}catch(e){}
let W={};try{W=JSON.parse(localStorage.getItem('rbw')||'{}')}catch(e){}
const sw=()=>{try{localStorage.setItem('rbw',JSON.stringify(W))}catch(e){}};
const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const logToday=id=>{const k=dk(new Date());(W[k]=W[k]||[]).push(id);sw()};
const DN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const CT=['ארוחת בוקר','ארוחת צהריים','ארוחת ערב','סלטים','קינוחים ואפייה','טיגונים','מרקים'];
const sv=()=>{try{localStorage.setItem('rb1',JSON.stringify(R))}catch(e){toast('הזיכרון בטלפון מלא. כדאי למחוק מתכונים עם תמונות')}};
const nid=()=>Date.now()+Math.floor(Math.random()*1000);
let tm;function toast(m,undo){const t=$('#t');t.innerHTML='<span style="flex:1">'+m+'</span>'+(undo?'<button onclick="un()">ביטול</button>':'');t.style.display='flex';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',4500)}
function view(h){const m=$('#m');m.className='';m.innerHTML=h;void m.offsetWidth;m.className='pg';$('#app').style.zoom=zm;window.scrollTo(0,0)}
function nav(){const T=[['home','home','בית'],['book','pot','המטבח'],['add','add','תיעוד'],['sug','spark','השראה'],['set','set','הגדרות']];const n=$('#nv');n.style.display='flex';n.innerHTML=T.map(t=>'<button class="'+(S.tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')" aria-label="'+t[2]+'"><span>'+I(t[1])+'</span>'+t[2]+'</button>').join('')}
function go(t){S.tab=t;S.cf=null;window._bk='add';nav();({home,book,add,sug,set})[t]()}
const cl=r=>'c'+(r.id%3);
// ---------- onboarding
const OB=[['book','ברוכה הבאה','כאן יישמרו כל המתכונים שלך, מסודרים ויפים'],['cam','צלמי ואני אכתוב','צילום של המנה, ואני אכתוב את המתכון במקומך'],['bell','תמיד איתך','תעדי מתכון בקול, בכתיבה או בתמונה, ותמצאי הכל במקום אחד']];
function ob(i){$('#nv').style.display='none';const o=OB[i];view('<div style="text-align:center;min-height:80vh;display:flex;flex-direction:column"><div style="flex:1"><div class="brand" style="margin-top:18px">ספר המתכונים</div>'+FL+'<div class="hero">'+I(o[0])+'</div><h1>'+o[1]+'</h1><p class="mu" style="max-width:270px;margin:8px auto;font-size:17px">'+o[2]+'</p></div><div class="dots">'+OB.map((x,j)=>'<i class="'+(j===i?'on':'')+'"></i>').join('')+'</div><button class="pb" onclick="'+(i<2?'ob('+(i+1)+')':'fin()')+'">'+(i<2?'הבא':'בואי נתחיל')+'</button><button class="gb" style="border:0;visibility:'+(i<2?'visible':'hidden')+'" onclick="fin()">דלגי</button></div>')}
function fin(){try{localStorage.setItem('rbo','1')}catch(e){}go('home')}
// ---------- home / book
function home(){const h=new Date().getHours();view('<div class="brand">ספר המתכונים</div>'+FL+'<div class="mu" style="text-align:center">'+(h<5?'לילה טוב':h<12?'בוקר טוב':h<18?'צהריים טובים':'ערב טוב')+'</div><h1 style="text-align:center;margin-bottom:16px">מה מבשלים היום?</h1><div class="cd hc"><div class="hi">'+I('book')+'</div><b style="font-size:21px;font-family:var(--hf);font-weight:500">מה הכנת היום?</b><div class="mu" style="margin:2px 0 4px">ספרי לי, צלמי או הקלידי</div><button class="pb" onclick="go(\'add\')">בואי נתעד</button></div><p class="qt">כל מתכון הוא סיפור קטן שכדאי לשמור</p><div class="row" style="margin:20px 0 10px"><b style="font-size:16px">האחרונים שלך</b><span class="mu">'+R.length+' מתכונים</span></div>'+(R.length?R.slice(-2).reverse().map(r=>'<div class="cd '+cl(r)+'"><b>'+esc(r.title)+'</b></div>').join(''):'<p class="mu">הספר עדיין ריק. אפשר להתחיל מהמתכון הראשון.</p>'))}
function card(r){const o=S.open===r.id;return '<div class="cd '+cl(r)+'" id="r'+r.id+'"><div class="row" onclick="tg('+r.id+')"><div style="flex:1"><b style="font-size:17px">'+esc(r.title)+'</b>'+(r.c?'<div style="font-size:12px;opacity:.8">'+r.c+'</div>':'')+'</div><button class="ib" aria-label="מועדף" onclick="event.stopPropagation();fv('+r.id+')" style="'+(r.f?'background:var(--cd);border-radius:50%;color:var(--pri)':'')+'">'+I('heart')+'</button>'+I('dn')+'</div>'+(o?'<div class="dt">'+(r.img?'<img src="'+r.img+'" alt="">':'')+(r.ing.length?'<b>מצרכים</b><br>'+r.ing.map(e=>'• '+esc(e)).join('<br>')+'<br>':'')+(r.st.length?'<b>הכנה</b><br>'+r.st.map((e,i)=>(i+1)+'. '+esc(e)).join('<br>')+'<br>':'')+(r.nt?esc(r.nt)+'<br>':'')+(S.cf===r.id?'<div class="cd" style="background:var(--cd);color:var(--tx);margin:10px 0 0">למחוק את '+esc(r.title)+'?<div style="display:flex;gap:8px;margin-top:8px"><button class="sm" style="background:var(--rd);color:var(--bg)" onclick="dl('+r.id+')">כן, מחקי</button><button class="sm" onclick="S.cf=null;lst()">ביטול</button></div></div>':'<div style="margin-top:8px"><button class="sm" onclick="ed('+r.id+')">'+I('pen')+' עריכה</button><button class="sm" style="color:var(--rd)" onclick="S.cf='+r.id+';lst()">'+I('bin')+' מחיקה</button></div>')+'</div>':'')+'</div>'}
function lst(){const q=S.q.trim(),l=R.filter(r=>(!S.cat||r.c===S.cat)&&(!q||r.title.includes(q)||r.ing.some(e=>e.includes(q)))).reverse();$('#l').innerHTML=l.map(card).join('')||'<p class="mu" style="text-align:center;margin-top:30px">אין מתכונים להצגה</p>'}
function book(){S.q='';S.kt=S.kt||'w';kit()}
function kit(){view('<div class="row"><h2 style="flex:1;margin:0">המטבח שלי</h2><button class="sm" style="background:var(--s0);color:var(--t0);margin:0" onclick="window._bk=\'book\';imp()">'+I('add')+' הוספת קבצים</button></div><div class="seg"><button class="'+(S.kt==='w'?'on':'')+'" onclick="S.kt=\'w\';kit()">השבוע שלי</button><button class="'+(S.kt==='r'?'on':'')+'" onclick="S.kt=\'r\';kit()">המתכונים שלי</button></div><div id="kb"></div>');S.kt==='w'?wk():rc()}
function rc(){S.cat=S.cat||'';$('#kb').innerHTML='<input type="text" placeholder="חיפוש מתכון או מצרך" value="'+esc(S.q)+'" oninput="S.q=this.value;lst()" style="border-radius:24px;margin-bottom:10px"><div id="cs" style="margin-bottom:10px"></div><div id="l"></div>';cs();lst()}
function cs(){$('#cs').innerHTML=['',...CT].map(c=>'<button class="chip sc'+(S.cat===c?' on':'')+'" onclick="S.cat=\''+c+'\';cs();lst()">'+(c||'הכל')+' <span class="mu" style="font-size:12px">'+R.filter(r=>!c||r.c===c).length+'</span></button>').join('')}
function wk(){const t=new Date(),o=S.wo||0,a=new Date(t.getFullYear(),t.getMonth(),t.getDate()-t.getDay()+7*o),z=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6),f=d=>d.getDate()+'.'+(d.getMonth()+1);let n=0;
let h='<div class="row" style="margin-bottom:12px"><button class="sm" style="margin:0" onclick="S.wo=(S.wo||0)-1;wk()">שבוע קודם</button><div style="flex:1;text-align:center;font-weight:600">'+f(a)+' - '+f(z)+(o?'<br><button class="ib mu" style="font-size:13px;text-decoration:underline" onclick="S.wo=0;wk()">חזרה להשבוע</button>':'')+'</div><button class="sm" style="margin:0" onclick="S.wo=(S.wo||0)+1;wk()">שבוע הבא</button></div>';
for(let i=0;i<7;i++){const d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i),k=dk(d),T=dk(t)===k,L=W[k]||[];n+=L.length;
h+='<div class="cd" style="background:'+(T?'var(--s0)':'var(--cd)')+(T?';color:var(--t0)':'')+'"><div class="row"><b>יום '+DN[i]+' <span class="mu" style="font-weight:400">'+f(d)+'</span></b>'+(T?'<span class="tag">היום</span>':'')+'<button class="ib" aria-label="הוספה" onclick="pkd(\''+k+'\')" style="color:var(--pri)">'+I('add')+'</button></div>'+L.map((x,j)=>{const r=typeof x==='string'?{title:x}:R.find(q=>q.id===x);return r?'<span class="pl">'+esc(r.title)+'<button aria-label="הסרה" onclick="rm(\''+k+'\','+j+')">×</button></span>':''}).join('')+(L.length?'':'<div class="mu" style="font-size:13px">עדיין לא תוכנן</div>')+'</div>'}
$('#kb').innerHTML=h}
function rm(k,j){W[k].splice(j,1);sw();wk()}
function pkd(k){S.pk=k;view('<button class="ib mu" onclick="kit()">'+I('bk')+' חזרה</button><h2>מה מכינים?</h2><input type="text" id="pf" placeholder="חיפוש בספר" oninput="pl2()" style="border-radius:24px"><div id="pr"></div><div class="cd" style="background:var(--cd);margin-top:14px"><b>או כתבי מה מכינים</b><input type="text" id="px" placeholder="למשל: דג ותפוחי אדמה" style="margin:8px 0"><button class="pb" style="margin:0" onclick="padd()">הוספה</button></div>');pl2()}
function pl2(){const q=($('#pf').value||'').trim();$('#pr').innerHTML=R.filter(r=>!q||r.title.includes(q)).reverse().map(r=>'<button class="cd tile c'+(r.id%3)+'" style="padding:12px 16px" onclick="pset('+r.id+')"><span><b>'+esc(r.title)+'</b>'+(r.c?'<span>'+r.c+'</span>':'')+'</span></button>').join('')||'<p class="mu">אין עדיין מתכונים בספר. אפשר לכתוב למטה.</p>'}
function pset(id){(W[S.pk]=W[S.pk]||[]).push(id);sw();kit()}
