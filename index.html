<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ספר המתכונים</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FDF5F6">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--hf:"Frank Ruhl Libre",Georgia,serif;--bg:#FDF5F6;--cd:#fff;--tx:#2a1f22;--mu:#7a6a6e;--bd:#f0dde3;--pri:#993556;--onp:#fff;--s0:#FBEAF0;--t0:#72243E;--s1:#FAECE7;--t1:#712B13;--s2:#E1F5EE;--t2:#085041;--rd:#A32D2D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1517;--cd:#2a2023;--tx:#f3e9ec;--mu:#b4a3a8;--bd:#3d2f33;--pri:#ED93B1;--onp:#4B1528;--s0:#4B1528;--t0:#F4C0D1;--s1:#4A1B0C;--t1:#F5C4B3;--s2:#04342C;--t2:#9FE1CB;--rd:#F09595}}
:root[data-theme="dark"]{--bg:#1c1517;--cd:#2a2023;--tx:#f3e9ec;--mu:#b4a3a8;--bd:#3d2f33;--pri:#ED93B1;--onp:#4B1528;--s0:#4B1528;--t0:#F4C0D1;--s1:#4A1B0C;--t1:#F5C4B3;--s2:#04342C;--t2:#9FE1CB;--rd:#F09595}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#fff 0%,#fdf4f6 55%,#f9e8ee 100%) fixed;color:var(--tx);font:16px/1.5 "Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(260px 260px at 90% 8%,rgba(244,192,209,.35),transparent 70%),radial-gradient(300px 300px at 5% 70%,rgba(250,236,231,.8),transparent 70%)}
#app{position:relative}
#app{max-width:480px;margin:0 auto;padding:18px 16px 110px;transition:zoom .2s}
h1,h2{font-family:var(--hf)}h1{font-size:28px;margin:0 0 4px;font-weight:500}h2{font-size:24px;margin:0 0 6px;font-weight:500}
.mu{color:var(--mu);font-size:14px}
.pg{animation:in .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px}
.pb{display:block;width:100%;height:50px;border:0;border-radius:25px;background:var(--pri);color:var(--onp);font-weight:600;font-size:17px;margin-top:10px}
.gb{display:block;width:100%;height:46px;border:1px solid var(--bd);border-radius:23px;background:transparent;margin-top:8px}
.cd{border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(153,53,86,.05),0 8px 20px rgba(153,53,86,.06)}
.c0{background:var(--s0);color:var(--t0)}.c1{background:var(--s1);color:var(--t1)}.c2{background:var(--s2);color:var(--t2)}
.tile{display:flex;gap:14px;align-items:center;width:100%;border:0;text-align:right;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ic{width:48px;height:48px;border-radius:50%;background:var(--cd);display:flex;align-items:center;justify-content:center;flex:none}
.tile b{display:block;font-size:17px}.tile span{font-size:13px}
input[type=text],textarea{width:100%;border:1px solid var(--bd);border-radius:16px;background:var(--cd);padding:12px 14px;margin-bottom:10px}
textarea{min-height:110px;resize:vertical}
select{border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);font:inherit;padding:0 8px}
nav{position:fixed;inset:auto 0 0 0;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{width:48px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:all .25s}
nav button.on{color:var(--t0);font-weight:600}nav button.on span{background:var(--s0);transform:scale(1.08)}
.row{display:flex;align-items:center;gap:8px}.row b{flex:1;font-size:17px}
.ib{border:0;background:none;color:inherit;padding:4px}
.dt{margin-top:10px;font-size:15px;line-height:1.7}.dt img{width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-bottom:8px}
.sm{height:38px;border-radius:19px;border:0;padding:0 14px;background:var(--cd);color:inherit;font-size:14px;margin-inline-end:8px}
.dots{display:flex;gap:6px;justify-content:center;margin:20px 0}.dots i{height:8px;width:8px;border-radius:4px;background:var(--bd);transition:all .3s}.dots i.on{width:22px;background:var(--pri)}
.hero{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#fbeaf0 72%);border:1px solid #f0cdd8;box-shadow:0 0 0 9px rgba(251,234,240,.65),0 12px 32px rgba(153,53,86,.14);color:var(--t0);display:flex;align-items:center;justify-content:center;margin:26px auto 28px;animation:pl 2.4s ease-in-out infinite}
.brand{text-align:center;font-family:var(--hf);letter-spacing:.14em;color:var(--pri);font-size:15px;font-weight:500}
.hc{background:linear-gradient(160deg,#fff,#fbeaf0);border:1px solid #f2d3dc;text-align:center;padding:22px 18px}
.hi{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;background:#fff;border:1px solid #f2d3dc;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.qt{text-align:center;font-family:var(--hf);color:var(--mu);font-style:italic;margin:18px 0 4px}
.hero .i{width:60px;height:60px}
@keyframes pl{50%{transform:scale(1.08)}}
#t{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:456px;margin:auto;background:var(--tx);color:var(--bg);border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:10px;z-index:9}
#t button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline}
.chip{border:1px solid var(--bd);background:transparent;border-radius:20px;height:40px;padding:0 16px;margin-inline-end:8px}.chip.on{background:var(--s0);color:var(--t0);border-color:transparent}
.bar{height:10px;border-radius:5px;background:var(--s0);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .5s}
.seg{display:flex;background:var(--s0);border-radius:16px;padding:4px;margin:14px 0}.seg button{flex:1;height:42px;border:0;border-radius:12px;background:none;color:var(--t0);font-weight:600;transition:all .2s}.seg button.on{background:var(--cd);box-shadow:0 2px 8px rgba(153,53,86,.12)}
.sc{height:36px;padding:0 12px;margin-bottom:8px;font-size:14px}
.pl{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:4px 6px 4px 12px;margin:8px 0 0 6px;font-size:14px}.pl button{border:0;background:none;color:var(--mu);font-size:18px;line-height:1;padding:0 4px}
.tag{background:var(--pri);color:var(--onp);border-radius:10px;padding:1px 10px;font-size:12px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs{display:flex;background:var(--s0);border-radius:23px;padding:3px;gap:2px}
.vs button{width:40px;height:40px;border:0;border-radius:20px;background:none;color:var(--t0);display:grid;place-items:center;padding:0}
.vs button.on{background:var(--cd);box-shadow:0 2px 8px rgba(153,53,86,.14)}
#cs{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#cs::-webkit-scrollbar{display:none}
#cs .chip{flex:0 0 auto}
.bkn{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.bkn button{width:44px;height:44px;border-radius:22px;border:1px solid var(--bd);background:var(--cd);color:var(--t0);font-size:24px;line-height:1;padding:0}
.bkn span{font-size:14px;color:var(--mu)}
.bkp{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.bkp::-webkit-scrollbar{display:none}
.pp{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;box-sizing:border-box;height:calc(100dvh - 390px);min-height:340px;overflow-y:auto;border-radius:24px;padding:18px 18px 22px;margin:0;line-height:1.75;font-size:16px;box-shadow:0 6px 22px rgba(153,53,86,.10)}
.pp .pt{font-family:var(--hf);font-size:25px;font-weight:500;line-height:1.3;margin:2px 0 2px}
.pp .pc{font-size:13px;opacity:.8;margin-bottom:8px}
.pp img.pi{display:block;width:100%;max-height:190px;object-fit:cover;border-radius:16px;margin:10px 0}
.pp .ph{font-size:12px;opacity:.65;text-align:center;margin-top:14px}
.gt{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(153,53,86,.05),0 8px 20px rgba(153,53,86,.08);transition:transform .15s}.gt:active{transform:scale(.97)}
.gi{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.gp{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55)}.gp .i{width:38px;height:38px;opacity:.7}
.gn{padding:8px 10px 2px;font-weight:600;font-size:15px;line-height:1.3}.gc{padding:0 10px 9px;font-size:12px;opacity:.8}
.gh{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--pri);display:flex;align-items:center;justify-content:center}.gh .i{width:16px;height:16px;fill:currentColor}
.pr{display:flex;gap:10px;align-items:center;background:var(--cd);border-radius:16px;padding:10px;margin-bottom:8px;border:1px solid var(--bd)}
.pr input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
.pr img,.pr .ph{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--s0);display:flex;align-items:center;justify-content:center;color:var(--t0)}
.pr select{width:100%;margin-top:4px;height:34px;font-size:13px}
.wn{display:inline-block;background:var(--s1);color:var(--t1);border-radius:10px;padding:0 8px;font-size:12px;margin-inline-start:6px}
.stk{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);padding-top:14px}
@media (prefers-reduced-motion:reduce){.pg,.hero{animation:none}}
</style>
</head>
<body>
<div id="app"><div id="m" class="pg"></div></div>
<div id="t"></div>
<nav id="nv" style="display:none"></nav>
<script>
const P={grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',pot:'<path d="M5 11h14v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM3 11h18M9 8V6M12 8V4M15 8V6"/>',home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',book:'<path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"/>',add:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',spark:'<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/>',bin:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',dn:'<path d="M6 9l6 6 6-6"/>',bk:'<path d="M5 12h14M13 6l6 6-6 6"/>',imp:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',bell:'<path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/>'};
const I=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>';
const $=s=>document.querySelector(s);
const FL='<svg viewBox="0 0 200 20" style="display:block;margin:6px auto;width:150px;color:var(--pri);opacity:.7" fill="none" stroke="currentColor" stroke-width="1"><path d="M10 10h70M120 10h70"/><path d="M100 3l6 7-6 7-6-7z"/><circle cx="86" cy="10" r="1.6"/><circle cx="114" cy="10" r="1.6"/></svg>';
const lk=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;word-break:break-all" onclick="event.stopPropagation()">$1</a>').replace(/\n/g,'<br>');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let R=[],S={tab:'home',open:null,cf:null,q:'',sg:null,un:null},zm=1,SC=null,NOIDB=false;
try{R=JSON.parse(localStorage.getItem('rb1')||'[]');zm=+localStorage.getItem('rbz')||1}catch(e){}
let W={};try{W=JSON.parse(localStorage.getItem('rbw')||'{}')}catch(e){}
const sw=()=>{try{localStorage.setItem('rbw',JSON.stringify(W))}catch(e){}};
const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const logToday=id=>{const k=dk(new Date());(W[k]=W[k]||[]).push(id);sw()};
const DN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const CT=['ארוחת בוקר','ארוחת צהריים','ארוחת ערב','סלטים','קינוחים ואפייה','טיגונים','מרקים'];
const sv=()=>{R.forEach(r=>{if(r.img&&!NOIDB&&!IS.has(r.id)){IS.add(r.id);iput(r.id,r.img)}});try{localStorage.setItem('rb1',JSON.stringify(NOIDB?R:R.map(r=>({...r,img:''}))))}catch(e){toast('הזיכרון בטלפון מלא. כדאי למחוק מתכונים עם תמונות')}};
let _n=0;const nid=()=>Date.now()*1000+(_n++%1000);
let tm;function toast(m,undo){const t=$('#t');t.innerHTML='<span style="flex:1">'+m+'</span>'+(undo?'<button onclick="un()">ביטול</button>':'');t.style.display='flex';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',4500)}
function view(h){const m=$('#m');m.className='';m.innerHTML=h;void m.offsetWidth;m.className='pg';$('#app').style.zoom=zm;window.scrollTo(0,0)}
function nav(){const T=[['home','home','בית'],['book','pot','המטבח'],['add','add','תיעוד'],['sug','spark','השראה'],['set','set','הגדרות']];const n=$('#nv');n.style.display='flex';n.innerHTML=T.map(t=>'<button class="'+(S.tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')" aria-label="'+t[2]+'"><span>'+I(t[1])+'</span>'+t[2]+'</button>').join('')}
function go(t){S.tab=t;S.cf=null;window._bk='add';nav();({home,book,add,sug,set})[t]()}
const cl=r=>'c'+(r.id%3);
const norm=t=>String(t).replace(/[^\p{L}\p{N}]/gu,'').toLowerCase();
// ---------- onboarding
const OB=[['book','ברוכה הבאה','כאן יישמרו כל המתכונים שלך, מסודרים ויפים'],['cam','צלמי ואני אכתוב','צילום של המנה, ואני אכתוב את המתכון במקומך'],['bell','תמיד איתך','תעדי מתכון בקול, בכתיבה או בתמונה, ותמצאי הכל במקום אחד']];
function ob(i){$('#nv').style.display='none';const o=OB[i];view('<div style="text-align:center;min-height:80vh;display:flex;flex-direction:column"><div style="flex:1"><div class="brand" style="margin-top:18px">ספר המתכונים</div>'+FL+'<div class="hero">'+I(o[0])+'</div><h1>'+o[1]+'</h1><p class="mu" style="max-width:270px;margin:8px auto;font-size:17px">'+o[2]+'</p></div><div class="dots">'+OB.map((x,j)=>'<i class="'+(j===i?'on':'')+'"></i>').join('')+'</div><button class="pb" onclick="'+(i<2?'ob('+(i+1)+')':'fin()')+'">'+(i<2?'הבא':'בואי נתחיל')+'</button><button class="gb" style="border:0;visibility:'+(i<2?'visible':'hidden')+'" onclick="fin()">דלגי</button></div>')}
function fin(){try{localStorage.setItem('rbo','1')}catch(e){}go('home')}
// ---------- home / book
function home(){const h=new Date().getHours();view('<div class="brand">ספר המתכונים</div>'+FL+'<div class="mu" style="text-align:center">'+(h<5?'לילה טוב':h<12?'בוקר טוב':h<18?'צהריים טובים':'ערב טוב')+'</div><h1 style="text-align:center;margin-bottom:16px">מה מבשלים היום?</h1><div class="cd hc"><div class="hi">'+I('book')+'</div><b style="font-size:21px;font-family:var(--hf);font-weight:500">מה הכנת היום?</b><div class="mu" style="margin:2px 0 4px">ספרי לי, צלמי או הקלידי</div><button class="pb" onclick="go(\'add\')">בואי נתעד</button></div><p class="qt">כל מתכון הוא סיפור קטן שכדאי לשמור</p><div class="row" style="margin:20px 0 10px"><b style="font-size:16px">האחרונים שלך</b><span class="mu">'+R.filter(r=>!r.p).length+' מתכונים</span></div>'+(R.some(r=>!r.p)?R.filter(r=>!r.p).slice(-2).reverse().map(r=>'<div class="cd '+cl(r)+'"><b>'+esc(r.title)+'</b></div>').join(''):'<p class="mu">הספר עדיין ריק. אפשר להתחיל מהמתכון הראשון.</p>'))}

view(bkb+'<h2>סריקה חכמה</h2><p class="mu">בחרי הרבה קבצים ביחד. אני קוראת כל אחד, מוצאת את המתכונים ומחלקת אותם לקטגוריות. כתב יד ו-PDF נתמכים.</p><label class="pb" style="line-height:50px;text-align:center">בחרי תמונות או קבצים<input type="file" accept="image/*,application/pdf,.pdf,.txt,text/plain" multiple hidden onchange="scanRun([...this.files])"></label><label class="gb" style="line-height:46px;text-align:center">'+I('cam')+' צלמי דף מתכון<input type="file" accept="image/*" capture="environment" hidden onchange="scanRun([...this.files])"></label><div class="cd c0" style="margin-top:14px;font-size:14px;line-height:1.8"><b>מ-Samsung Notes</b><br>1. לחיצה ארוכה על הערה, ובחירת כמה הערות<br>2. שיתוף, ואז PDF או תמונה<br>3. בוחרים את "ספר המתכונים" ברשימת השיתוף (אחרי התקנת האפליקציה), או שומרים ובוחרים את הקבצים כאן</div><p class="mu">קבצים שכבר נסרקו מדולגים, אז אפשר להפסיק ולהמשיך בכל זמן. כדאי להשאיר את המסך דלוק.</p>')}
function scanView(){window._bk='add';view('<h2>סורקת את המתכונים</h2><div class="bar" style="margin:14px 0"><i id="sb" style="width:0"></i></div><p id="st" class="mu"></p><div class="cd c0" style="font-size:14px">אפשר לעבור למסכים אחרים, הסריקה תמשיך. כדאי להשאיר את המסך דלוק.</div><button class="gb" onclick="SC.stop=true;SC.ctl.abort()">עצירה</button>');scanDraw()}
function scanDraw(){const b=$('#sb');if(!b||!SC)return;b.style.width=Math.round(SC.done/Math.max(SC.total,1)*100)+'%';$('#st').textContent='קובץ '+Math.min(SC.done+1,SC.total)+' מתוך '+SC.total+'. נמצאו '+SC.found+' מתכונים'}
async function scanOne(f){const p=await prep(f),body=p.k==='text'?{kind:'text',text:p.text}:{kind:p.k,data:p.data};let res;
for(let a=0;;a++){try{res=await api('scan',body,SC.ctl.signal);break}catch(e){const rt=(e.code==='limit'||e.code==='srv'||e.code==='net')&&a<2;if(!rt)throw e;await sleep(e.code==='limit'?15000:2500*(a+1))}}
const l=(res&&res.recipes)||[];if(!l.length){SC.skip++;return}
for(const m of l){const r=fromAi(m,p.thumb);if(!r.title)continue;if(R.some(x=>norm(x.title)===norm(r.title))){SC.dup++;continue}r.p=1;r.u=m.unclear||/\[לא ברור\]/.test(JSON.stringify(m))?1:0;R.push(r);SC.found++}
sv()}
async function scanRun(fs){fs=fs.filter(Boolean);if(!fs.length)return;let ds=new Set();try{ds=new Set(JSON.parse(localStorage.getItem('rbd')||'[]'))}catch(e){}
const sg=f=>f.name+'|'+f.size+'|'+(f.lastModified||0),todo=fs.filter(f=>!ds.has(sg(f)));
SC={total:todo.length,done:0,found:0,dup:0,skip:0,fail:0,already:fs.length-todo.length,stop:false,ctl:new AbortController(),fin:0,err:''};
if(!todo.length){scanEnd();return}
let wl;try{wl=await navigator.wakeLock.request('screen')}catch(e){}
scanView();let i=0;
const run=async()=>{while(i<todo.length&&!SC.stop){const f=todo[i++];try{await scanOne(f);ds.add(sg(f));try{localStorage.setItem('rbd',JSON.stringify([...ds].slice(-4000)))}catch(e){}}catch(e){if(e.code==='auth'||e.code==='abort'||e.code==='noai'){SC.stop=true;SC.err=e.code}else SC.fail++}SC.done++;scanDraw()}};
await Promise.all([run(),run()]);try{wl&&wl.release()}catch(e){}scanEnd()}
function scanEnd(){const s=SC;s.fin=1;const pn=R.filter(r=>r.p).length;
if(!$('#sb')&&!s.err&&s.total){toast('הסריקה הסתיימה. '+pn+' מתכונים ממתינים לאישור');return}
const row=(n,t)=>n?'<div>'+t+': <b>'+n+'</b></div>':'';
view('<div style="text-align:center;margin-top:30px"><div class="hero" style="background:var(--s2);color:var(--t2)">'+I(s.err?'bell':'ok')+'</div><h1>'+(s.err==='auth'?'צריך לתקן את החיבור':s.err?'הסריקה נעצרה':s.total?'הסריקה הסתיימה':'הכל כבר נסרק')+'</h1></div><div class="cd c0" style="line-height:1.9">'+row(s.found,'מתכונים חדשים')+row(s.dup,'כבר היו בספר')+row(s.skip,'קבצים בלי מתכון')+row(s.fail,'קבצים שלא הצלחתי לקרוא')+row(s.already,'נסרקו קודם ודולגו')+(s.err==='auth'?'<div>'+aerr({code:'auth'})+'</div>':'')+(s.err==='abort'?'<div>אפשר להמשיך בכל זמן, הקבצים שנסרקו ידולגו.</div>':'')+'</div>'+(pn?'<button class="pb" onclick="pend()">לבדיקה ואישור ('+pn+')</button>':'')+'<button class="gb" onclick="go(\''+(s.err==='auth'?'set':'book')+'\')">'+(s.err==='auth'?'להגדרות':'למטבח שלי')+'</button>')}
// ---------- בדיקה ואישור ----------
const pck=r=>S.ck&&S.ck[r.id]!==undefined?S.ck[r.id]:!r.u;
function pend(){window._bk='book';S.kt='r';S.tab='book';nav();S.pd=0;const P=R.filter(r=>r.p);if(!P.length){go('book');return}
view(bkb+'<h2>לבדיקה ואישור</h2><p class="mu">'+P.length+' מתכונים נסרקו. תקני קטגוריה אם צריך, ואשרי. מתכונים עם מילים לא ברורות לא מסומנים מראש.</p><div class="row" style="margin:8px 0"><button class="sm" style="margin:0" onclick="pall(1)">סימון הכל</button><button class="sm" style="margin:0" onclick="pall(0)">ביטול סימון</button></div><div id="pl3"></div><div class="stk" id="pf3"></div>');pr()}
function pr(){const P=R.filter(r=>r.p);$('#pl3').innerHTML=P.map(r=>'<div class="pr"><input type="checkbox" aria-label="אישור" '+(pck(r)?'checked':'')+' onchange="S.ck=S.ck||{};S.ck['+r.id+']=this.checked;pcount()">'+(r.img?'<img alt="" loading="lazy" src="'+r.img+'">':'<div class="ph">'+I('book')+'</div>')+'<div style="flex:1;min-width:0"><button class="ib" style="font-weight:600;font-size:15px;text-align:right;padding:0" onclick="pe('+r.id+')">'+esc(r.title)+'</button>'+(r.u?'<span class="wn">יש מילים לא ברורות</span>':'')+'<select aria-label="קטגוריה" onchange="pcat('+r.id+',this.value)"><option value="">בלי קטגוריה</option>'+CT.map(c=>'<option'+(r.c===c?' selected':'')+'>'+c+'</option>').join('')+'</select></div></div>').join('');pcount()}
function pcount(){const P=R.filter(r=>r.p),n=P.filter(pck).length;$('#pf3').innerHTML='<button class="pb" onclick="papp()">אשרי את המסומנים ('+n+')</button>'+(P.length-n?'<button class="gb" style="color:var(--rd);background:var(--bg)" onclick="pdel()">'+(S.pd?'לחצי שוב למחיקה סופית':'מחקי את הלא מסומנים ('+(P.length-n)+')')+'</button>':'')}
function pall(v){S.ck={};R.filter(r=>r.p).forEach(r=>S.ck[r.id]=!!v);pr()}
function pcat(id,c){const r=R.find(x=>x.id===id);if(r){r.c=c;sv()}}
function pe(id){window._bk='book';review(R.find(x=>x.id===id),0,()=>pend(),false)}
function papp(){let n=0;R.filter(r=>r.p&&pck(r)).forEach(r=>{delete r.p;delete r.u;n++});sv();S.ck={};toast(n+' מתכונים נוספו למטבח');R.some(r=>r.p)?pend():go('book')}
function pdel(){if(!S.pd){S.pd=1;pcount();return}const del=R.filter(r=>r.p&&!pck(r));R.splice(0,R.length,...R.filter(r=>!(r.p&&!pck(r))));sv();S.ck={};S.pd=0;toast(del.length+' נמחקו');R.some(r=>r.p)?pend():go('book')}
// ---------- עמוד מתכון (גלריה) ----------
function rp(id){const r=R.find(x=>x.id===id);if(!r)return go('book');window._bk='book';
view(bkb+(r.img?'<img src="'+r.img+'" alt="" style="width:100%;max-height:280px;object-fit:cover;border-radius:20px;margin-bottom:12px">':'')+'<div class="row"><h2 style="flex:1;margin:0">'+esc(r.title)+'</h2><button class="ib" aria-label="מועדף" onclick="fv('+id+');rp('+id+')" style="'+(r.f?'color:var(--pri)':'')+'">'+I('heart')+'</button></div>'+(r.c?'<div class="mu" style="margin:2px 0 8px">'+r.c+'</div>':'')+'<div class="cd" style="background:var(--cd);line-height:1.8;font-size:16px">'+(r.ing.length?'<b>מצרכים</b><br>'+r.ing.map(e=>'• '+esc(e)).join('<br>')+'<br><br>':'')+(r.st.length?'<b>הכנה</b><br>'+r.st.map((e,i)=>(i+1)+'. '+esc(e)).join('<br>'):'')+(r.nt?'<br><br>'+lk(r.nt):'')+(!r.ing.length&&!r.st.length&&!r.nt?'<span class="mu">עוד לא נכתבו פרטים. אפשר להוסיף בעריכה.</span>':'')+'</div><div><button class="sm" onclick="ed('+id+')">'+I('pen')+' עריכה</button><button class="sm" style="color:var(--rd)" onclick="rd1('+id+')">'+I('bin')+' מחיקה</button></div><div id="rc"></div>')}
function rd1(id){$('#rc').innerHTML='<div class="cd" style="background:var(--cd);margin-top:10px">למחוק את המתכון?<div style="display:flex;gap:8px;margin-top:8px"><button class="sm" style="background:var(--rd);color:var(--bg)" onclick="dl('+id+');go(\'book\')">כן, מחקי</button><button class="sm" onclick="$(\'#rc\').innerHTML=\'\'">ביטול</button></div></div>'}
// ---------- שיתוף מ-Samsung Notes ----------
async function sharedIn(){history.replaceState(null,'',location.pathname);const fs=[];
try{const c=await caches.open('rb-share');for(const k of await c.keys()){const r=await c.match(k);if(!r)continue;const b=await r.blob();fs.push(new File([b],decodeURIComponent(r.headers.get('x-name')||'shared.txt'),{type:r.headers.get('content-type')||b.type,lastModified:+r.headers.get('x-mod')||0}));await c.delete(k)}}catch(e){}
if(!fs.length)return;if(!hasAI()){go('add');toast('כדי לסרוק צריך לחבר את הסריקה החכמה בהגדרות');return}
S.tab='add';nav();scanRun(fs)}
async function boot(){
try{const m=await iall();R.forEach(r=>{if(m[r.id]){if(!r.img)r.img=m[r.id];IS.add(r.id)}});if(R.length){const ids=new Set(R.map(r=>String(r.id)));Object.keys(m).forEach(k=>{if(!ids.has(k))idel(k)})}}catch(e){NOIDB=true}
await seedIn();sv();const g=localStorage.getItem('rbg');S.vm=g==='g'||g==='1'?'g':g==='l'||g==='0'?'l':'b';if(S.seeded)S.kt='r';cfgFromHash()}
async function seedIn(){try{const a=localStorage.getItem('rbi')==='1',b=localStorage.getItem('rbi2')==='1';if(a&&b)return;const r=await fetch('./seed.json'),j=await r.json(),m=new Map(R.map(x=>[x.id,x]));let n=0;(j.r||[]).forEach(x=>{if(!x||!x.title)return;const e=m.get(x.id);if(!e){if(!a){R.push(x);n++}return}if(!e.img&&x.img){e.img=x.img;n++}if(x.nt&&!/http/.test(e.nt||'')&&/http/.test(x.nt)){e.nt=(e.nt?e.nt+'\n':'')+x.nt.split('\n').filter(l=>/http/.test(l)).join('\n')}});localStorage.setItem('rbi','1');localStorage.setItem('rbi2','1');if(n)S.seeded=n}catch(e){}}
boot().then(async()=>{const sh=/[?&]shared=1/.test(location.search);if(sh){try{localStorage.setItem('rbo','1')}catch(e){}}localStorage.getItem('rbo')?go('home'):ob(0);if(S.cfgd)toast('הסריקה החכמה חוברה');else if(S.seeded)toast(S.seeded+' מתכונים נוספו לספר');if(sh)await sharedIn()});
</script>
